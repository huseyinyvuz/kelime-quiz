<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6c63ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kelime">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Kelime Ogren</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card2: #22263a;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --green: #43e97b;
    --red: #ff4d6d;
    --yellow: #ffd166;
    --text: #e8eaf6;
    --muted: #8b8fa8;
    --border: #2e3250;
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    min-height: 100%;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 12px max(40px, env(safe-area-inset-bottom));
    overflow-x: hidden;
  }

  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

  h1 { font-size: 1.5rem; font-weight: 900; color: #fff; margin-bottom: 4px; text-align:center; }
  .subtitle { font-size: 0.78rem; color: var(--muted); margin-bottom: 18px; text-align: center; }

  .tabs {
    display: flex; gap: 8px;
    width: 100%; max-width: 480px; margin-bottom: 16px;
  }
  .tab {
    flex: 1; padding: 9px 4px; border-radius: 12px;
    background: var(--card); border: 1.5px solid var(--border);
    color: var(--muted); font-family: 'Nunito', sans-serif;
    font-size: 0.78rem; font-weight: 700; cursor: pointer;
    transition: all 0.2s; text-align: center; min-height:44px;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  #app { width: 100%; max-width: 480px; }

  /* PROGRESS */
  .progress-label {
    font-size: 0.72rem; color: var(--muted); margin-bottom: 8px;
    display: flex; justify-content: space-between;
  }
  .progress-bar-wrap {
    background: var(--border); border-radius: 99px; height: 6px;
    margin-bottom: 14px; overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px; transition: width 0.4s ease;
  }

  /* QUIZ CARD - shows the English word */
  .quiz-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 20px 22px;
    text-align: center;
    margin-bottom: 14px;
    animation: fadeUp 0.3s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .word-type-badge {
    font-size: 0.65rem; font-weight: 800; letter-spacing: 1px;
    text-transform: uppercase; padding: 3px 10px; border-radius: 99px;
    margin-bottom: 12px; display: inline-block;
  }
  .badge-V    { background:#1a2e4a; color:#5ba4ff; }
  .badge-N    { background:#1e2e1e; color:#43e97b; }
  .badge-Adj  { background:#2e1a2e; color:#da84da; }
  .badge-Adv  { background:#2e2218; color:var(--yellow); }
  .badge-Expr { background:#2e1e1e; color:var(--accent2); }

  .quiz-word {
    font-family: 'Lora', serif;
    font-size: 2rem; font-weight: 600; color: #fff;
    line-height: 1.2; margin-bottom: 5px; overflow-wrap:anywhere;
  }
  .quiz-label { font-size: 0.75rem; color: var(--muted); margin-top: 6px; }

  /* CHOICES */
  .choices { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }

  .choice-btn {
    width: 100%; padding: 13px 14px;
    border-radius: 14px; border: 1.8px solid var(--border);
    background: var(--card2); color: var(--text);
    font-family: 'Nunito', sans-serif; font-size: 0.9rem; font-weight: 700;
    cursor: pointer; transition: border-color 0.15s, background 0.15s, transform 0.1s;
    text-align: left; display: flex; align-items: center; gap: 11px;
    animation: fadeUp 0.25s ease;
    min-height: 52px;
  }
  .choice-btn:active:not(.disabled) { transform: scale(0.97); }
  .choice-btn:hover:not(.disabled)  { border-color: var(--accent); background: #1e2040; }
  .choice-btn:hover:not(.disabled) .cletter { background: var(--accent); color: #fff; }

  .cletter {
    min-width: 28px; height: 28px; border-radius: 8px;
    background: var(--border); display: flex; align-items: center;
    justify-content: center; font-size: 0.75rem; font-weight: 900;
    transition: background 0.15s, color 0.15s; flex-shrink: 0;
  }
  .choice-text { min-width:0; overflow-wrap:anywhere; line-height:1.25; }

  /* Answer states */
  .choice-btn.correct          { border-color: var(--green); background: #0a2218; color: var(--green); }
  .choice-btn.correct .cletter { background: var(--green); color: #0a1f12; }
  .choice-btn.wrong            { border-color: var(--red); background: #2a0c14; color: var(--red); opacity:.9; }
  .choice-btn.wrong .cletter   { background: var(--red); color: #fff; }
  .choice-btn.dimmed           { opacity: 0.35; }
  .choice-btn.disabled         { cursor: default; }

  /* FEEDBACK */
  .feedback {
    border-radius: 14px; padding: 13px 15px; margin-bottom: 12px;
    display: flex; align-items: center; gap: 11px;
    animation: fadeUp 0.2s ease; font-size: 0.88rem; font-weight: 700;
  }
  .feedback.correct { background:#0a2218; border:1.5px solid var(--green); color: var(--green); }
  .feedback.wrong   { background:#2a0c14; border:1.5px solid var(--red); color:#fff; }
  .feedback .ficon  { font-size: 1.4rem; }
  .feedback .fsub   { font-size: 0.75rem; color:var(--muted); margin-top:3px; font-weight:600; }

  .next-btn {
    width: 100%; padding: 14px; border-radius: 14px; border: none;
    font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 800;
    cursor: pointer; background: linear-gradient(135deg, var(--accent), #8b5cf6);
    color:#fff; transition: transform 0.1s;
  }
  .next-btn:active { transform: scale(0.98); }

  /* TEACH */
  .teach-header {
    background: linear-gradient(135deg,#2d1f5e,#1a2e4a);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px;
    text-align:center; border:1.5px solid #3d3070;
  }
  .teach-header h2 { font-size:1rem; color:#c9c0ff; font-weight:700; }
  .teach-header p  { font-size:0.75rem; color:var(--muted); margin-top:3px; }

  .teach-card {
    background: var(--card); border:1.5px solid var(--border);
    border-radius: var(--radius); padding:22px 20px; margin-bottom:12px;
    animation: fadeUp 0.3s ease; position:relative; overflow:hidden;
  }
  .teach-card::before {
    content:''; position:absolute; left:0;top:0;bottom:0; width:4px;
    background:linear-gradient(180deg,var(--accent),var(--accent2));
    border-radius:4px 0 0 4px;
  }
  .teach-word { font-family:'Lora',serif; font-size:1.6rem; font-weight:600; color:#fff; margin-bottom:6px; }
  .teach-tr   { font-size:1rem; font-weight:800; color:var(--yellow); margin-bottom:6px; }
  .teach-syn  { font-size:0.8rem; color:var(--muted); font-style:italic; }
  .teach-tip  {
    background:var(--card2); border-radius:10px; padding:10px 12px;
    margin-top:12px; font-size:0.8rem; color:#b0b8d8; line-height:1.5;
    border:1px solid var(--border);
  }
  .teach-tip span { color:var(--accent2); font-weight:700; }

  .teach-example { margin-top:16px; padding:14px; background:var(--card2); border:1px solid var(--border); border-radius:12px; overflow-wrap:anywhere; }
  .teach-example-label { font-size:0.72rem; font-weight:800; color:var(--accent2); margin-bottom:8px; }
  .teach-example-en { font-size:0.95rem; line-height:1.6; }
  .teach-example-en mark { background:transparent; color:var(--yellow); font-weight:800; }
  .teach-example-tr { margin-top:8px; font-size:0.85rem; color:#b0b8d8; line-height:1.5; }

  .nav-dots { display:flex; gap:7px; justify-content:center; margin-bottom:14px; }
  .nav-dot {
    width:8px;height:8px;border-radius:50%;background:var(--border);
    transition:all 0.2s;cursor:pointer;
  }
  .nav-dot.active { background:var(--accent); width:20px; border-radius:4px; }

  .btn-full {
    width:100%; padding:14px; border-radius:14px; border:none;
    font-family:'Nunito',sans-serif; font-size:0.95rem; font-weight:800;
    cursor:pointer; background:linear-gradient(135deg,var(--accent),#8b5cf6);
    color:#fff; transition:transform 0.1s; margin-bottom:8px;
  }
  .btn-full:active { transform:scale(0.98); }
  .btn-full.secondary {
    background:var(--card2); color:var(--muted);
    border:1px solid var(--border); margin-bottom:0;
  }

  /* RESULT */
  .result-card {
    background:var(--card); border-radius:var(--radius); padding:28px 20px;
    text-align:center; border:1.5px solid var(--border); animation:fadeUp 0.3s ease;
  }
  .result-emoji  { font-size:3rem; margin-bottom:10px; }
  .result-title  { font-size:1.3rem; font-weight:900; color:#fff; margin-bottom:6px; }
  .result-sub    { font-size:0.85rem; color:var(--muted); margin-bottom:20px; line-height:1.5; }
  .result-stats  { display:flex; gap:10px; justify-content:center; margin-bottom:20px; }
  .stat-box      { flex:1; background:var(--card2); border-radius:12px; padding:12px 8px; border:1px solid var(--border); }
  .stat-num      { font-size:1.6rem; font-weight:900; }
  .stat-label    { font-size:0.7rem; color:var(--muted); font-weight:600; }
  .stat-box.g .stat-num { color:var(--green); }

  /* LEARNED LIST */
  .list-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .list-header h2 { font-size:1rem; font-weight:800; }
  .list-count {
    font-size:0.75rem; background:var(--card2); border:1px solid var(--border);
    padding:3px 10px; border-radius:99px; color:var(--muted);
  }
  .list-item {
    background:var(--card); border:1.5px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:8px; display:flex; align-items:center;
    justify-content:space-between; gap:8px;
  }
  .list-word { font-family:'Lora',serif; font-size:1rem; font-weight:600; color:#fff; }
  .list-tr   { font-size:0.78rem; color:var(--yellow); font-weight:700; text-align:right; flex-shrink:0; }
  .empty-state { text-align:center; padding:40px 20px; color:var(--muted); font-size:0.9rem; line-height:1.6; }
  .empty-icon  { font-size:2.5rem; margin-bottom:10px; }

  @media (max-width: 420px) {
    body { padding-left: 10px; padding-right: 10px; }
    h1 { font-size: 1.35rem; }
    .tabs { gap: 6px; margin-bottom: 12px; }
    .tab { font-size: 0.72rem; padding: 8px 4px; }
    .quiz-card { padding: 22px 14px 18px; margin-bottom: 12px; }
    .quiz-word { font-size: clamp(1.45rem, 8vw, 1.9rem); }
    .choices { gap: 8px; }
    .choice-btn { border-radius: 12px; font-size: 0.86rem; padding: 12px 10px; gap: 9px; }
    .feedback { align-items:flex-start; }
    .result-stats { flex-direction: column; }
    .list-item { align-items:flex-start; flex-direction:column; }
    .list-tr { text-align:left; }
  }

  .practice-controls { display:grid; gap:8px; margin-bottom:14px; }
  .practice-controls label,.session-label,.screen-note { font-size:0.78rem; color:var(--muted); line-height:1.6; }
  .screen-note { margin:10px 0 14px; }
  .session-label { margin-bottom:10px; }
  .practice-controls select { width:100%; min-height:44px; background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:10px; font:inherit; }
  .cloze-sentence { font-family:'Lora',serif; font-size:1.3rem; line-height:1.6; overflow-wrap:anywhere; }
  .cloze-gap { color:var(--yellow); white-space:nowrap; }
  .mistake-card { background:var(--card); border:1px solid var(--border); border-radius:12px; margin-bottom:10px; overflow:hidden; }
  .mistake-card summary { cursor:pointer; padding:14px; min-height:48px; overflow-wrap:anywhere; }
  .mistake-card summary span { display:block; margin-top:5px; color:var(--yellow); font-size:0.8rem; }
  .mistake-body { padding:0 14px 14px; }
  .section-title { margin:20px 0 10px; font-size:1rem; }
  .progress-table { width:100%; border-collapse:collapse; font-size:0.8rem; }
  .progress-table th,.progress-table td { padding:10px 5px; text-align:left; border-bottom:1px solid var(--border); }
  .tab { min-width:0; font-size:0.7rem; }


  .word-family { margin-top:14px; padding:14px; border:1px solid var(--border); border-radius:12px; background:var(--card2); }
  .word-family h3 { font-size:0.85rem; color:var(--accent2); margin-bottom:8px; }
  .family-base { font-size:0.8rem; line-height:1.5; color:#b0b8d8; margin-bottom:10px; }
  .family-base strong { color:var(--yellow); }
  .family-list { list-style:none; }
  .family-list li { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:4px 12px; padding:8px 0; border-top:1px solid var(--border); font-size:0.85rem; overflow-wrap:anywhere; }
  .family-list li>span { min-width:0; }
  .family-type { display:inline-block; font-size:0.68rem; color:var(--muted); margin-left:7px; }
  .family-meaning { color:#b0b8d8; }
  .family-current strong { color:var(--yellow); }
  .family-note { font-size:0.7rem; color:var(--muted); margin-top:8px; line-height:1.5; }

  .tabs { flex-wrap:wrap; }
  .tab { flex:1 1 28%; }
  button:disabled { cursor:default; opacity:0.5; }
</style>
</head>

function escapeHTML(text){
  return String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderExample(word){
  const example = EXAMPLES[word.word];
  if(!example) return '';
  const start = example.en.toLowerCase().indexOf(word.word.toLowerCase());
  const end = start + word.word.length;
  const sentence = start < 0 ? escapeHTML(example.en)
    : escapeHTML(example.en.slice(0,start)) + '<mark>' + escapeHTML(example.en.slice(start,end)) + '</mark>' + escapeHTML(example.en.slice(end));
  return `<div class="teach-example">
    <div class="teach-example-label">Örnek cümle</div>
    <p class="teach-example-en" lang="en">${sentence}</p>
    <p class="teach-example-tr" lang="tr">${escapeHTML(example.tr)}</p>
  </div>`;
}

// ===== STATE =====
let S = {
  allWords: [],
  usedWords: new Set(),
  learnedWords: [],
  quiz: [],          // current 10-word set
  idx: 0,           // current question index
  unknowns: [],     // wrong answers this round
  phase: 'quiz',    // quiz | teach | result
  teachIdx: 0,
  tab: 'quiz',
  choices: [],       // 5 options for current question
  correctPos: -1,    // which position is correct
  selected: -1,
  answered: false,
};

function memTip(w, tr, syn) {
  const tips = [
    `"<span>${w}</span>" kelimesi Turkcede <strong style="color:var(--yellow)">${tr}</strong> anlamina gelir. Synonym: ${syn}`,
    `Hatirla: <span>${w}</span> - ${syn} - <strong style="color:var(--yellow)">${tr}</strong>`,
    `"${w}" kelimesini "${tr}" olarak ezberle. Benzer kelime: <span>${syn}</span>`,
    `Ing: <span>${w}</span> | Turkce: <strong style="color:var(--yellow)">${tr}</strong> | Esanlamli: ${syn}`,
  ];
  return tips[Math.floor(Math.random()*tips.length)];
}

function shuffle(a){
  const r=[...a];
  for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}
  return r;
}

function save(){
  try{
    localStorage.setItem('kl_learned',JSON.stringify(S.learnedWords));
    localStorage.setItem('kl_used',JSON.stringify([...S.usedWords]));
  }catch(e){}
}

function load(){
  try{
    const l=localStorage.getItem('kl_learned'); if(l) S.learnedWords=JSON.parse(l);
    const u=localStorage.getItem('kl_used');    if(u) S.usedWords=new Set(JSON.parse(u));
  }catch(e){}
}

function available(){
  const lid=new Set(S.learnedWords.map(w=>w.id));
  return S.allWords.filter(w=>!lid.has(w.id)&&!S.usedWords.has(w.id));
}

function startNewQuiz(){
  let avail=available();
  if(avail.length<10){
    S.usedWords=new Set(S.learnedWords.map(w=>w.id));
    save();
    avail=available();
  }
  const picked=shuffle(avail).slice(0,10);
  if(picked.length===0){
    S.quiz=[]; S.idx=0; S.unknowns=[]; S.phase='result';
    save(); render(); return;
  }
  picked.forEach(w=>S.usedWords.add(w.id));
  S.quiz=picked; S.idx=0; S.unknowns=[]; S.phase='quiz';
  save();
  buildChoices();
  render();
}

function buildChoices(){
  if(S.phase!=='quiz'||S.idx>=S.quiz.length) return;
  const correct=S.quiz[S.idx];
  // 4 wrong options, each with a different Turkish meaning.
  const pool=shuffle(S.allWords.filter(w=>w.id!==correct.id&&trOf(w)!==trOf(correct)));
  const five=shuffle([correct,...pool.slice(0,4)]);
  S.choices=five;
  S.correctPos=five.findIndex(w=>w.id===correct.id);
  S.selected=-1;
  S.answered=false;
}

function pick(i){
  if(S.answered) return;
  S.selected=i; S.answered=true;
  const correct=S.quiz[S.idx];
  if(i===S.correctPos){
    if(!S.learnedWords.find(w=>w.id===correct.id)) S.learnedWords.push(correct);
  } else {
    S.unknowns.push(correct);
  }
  save(); render();
}

function nextQ(){
  S.idx++;
  if(S.idx>=S.quiz.length){
    if(S.unknowns.length===0){ S.phase='result'; }
    else { S.phase='teach'; S.teachIdx=0; }
    save(); render(); return;
  }
  buildChoices(); render();
}

function nextTeach(){
  S.teachIdx++;
  if(S.teachIdx>=S.unknowns.length){
    S.quiz=shuffle(S.unknowns); S.unknowns=[];
    S.idx=0; S.phase='quiz';
    buildChoices();
  }
  render();
}
function prevTeach(){ if(S.teachIdx>0){S.teachIdx--;render();} }
function goTeach(i){ S.teachIdx=i; render(); }
function doneTeach(){
  const rem=S.unknowns.length>0?S.unknowns:S.quiz.filter(w=>!S.learnedWords.find(l=>l.id===w.id));
  if(rem.length===0){S.phase='result';render();return;}
  S.quiz=shuffle(rem); S.unknowns=[];
  S.idx=0; S.phase='quiz';
  buildChoices(); render();
}

function switchTab(t){
  S.tab=t;
  document.querySelectorAll('.tab').forEach((el,i)=>{
    el.classList.toggle('active',(i===0&&t==='quiz')||(i===1&&t==='learned'));
  });
  render();
}

function badge(type){ return `<span class="word-type-badge badge-${type}">${type}</span>`; }

// ===== RENDER =====
function render(){
  const app=document.getElementById('app');
  if(S.tab==='learned'){renderLearned(app);return;}
  if(S.phase==='quiz')   renderQuiz(app);
  else if(S.phase==='teach')  renderTeach(app);
  else if(S.phase==='result') renderResult(app);
}

function renderQuiz(app){
  const total=S.quiz.length, idx=S.idx;
  const word=S.quiz[idx];
  if(!word){ renderResult(app); return; }
  const pct=Math.round(idx/total*100);
  const {choices,correctPos,selected,answered}=S;

  const choicesHTML=choices.map((c,i)=>{
    let cls='choice-btn';
    if(answered){
      cls+=' disabled';
      if(i===correctPos)      cls+=' correct';
      else if(i===selected)   cls+=' wrong';
      else                    cls+=' dimmed';
    }
    return `<button class="${cls}" onclick="pick(${i})">
      <span class="cletter">${LETTERS[i]}</span>
      <span class="choice-text">${trOf(c)}</span>
    </button>`;
  }).join('');

  let feedbackHTML='';
  if(answered){
    const ok=selected===correctPos;
    if(ok){
      feedbackHTML=`<div class="feedback correct">
        <span class="ficon">OK</span>
        <div><div>Dogru! Harika!</div></div>
      </div>`;
    } else {
      feedbackHTML=`<div class="feedback wrong">
        <span class="ficon">X</span>
        <div>
          <div>Yanlis cevap</div>
          <div class="fsub">Dogru cevap: <strong style="color:var(--green)">${trOf(word)}</strong></div>
        </div>
      </div>`;
    }
  }

  app.innerHTML=`
    <div class="progress-label">
      <span>Soru ${idx+1} / ${total}</span>
      <span>${S.learnedWords.length} ogrenildi</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" style="width:${pct}%"></div>
    </div>
    <div class="quiz-card">
      ${badge(word.type)}
      <div class="quiz-word">${word.word}</div>
      <div class="quiz-label">Turkce karsiligini sec</div>
    </div>
    <div class="choices">${choicesHTML}</div>
    ${feedbackHTML}
    ${answered?`<button class="next-btn" onclick="nextQ()">${idx+1<total?'Sonraki Soru':'Sonuclari Gor'}</button>`:''}
  `;
}

function renderTeach(app){
  const words=S.unknowns, idx=S.teachIdx, word=words[idx];
  const meaning=trOf(word);
  const dots=words.map((_,i)=>`<div class="nav-dot ${i===idx?'active':''}" onclick="goTeach(${i})"></div>`).join('');
  app.innerHTML=`
    <div class="teach-header">
      <h2>Ogrenme Zamani!</h2>
      <p>${words.length} kelimeyi incele, sonra tekrar test edileceksin.</p>
    </div>
    <div class="teach-card">
      <div style="margin-bottom:10px">${badge(word.type)}<div class="teach-word">${word.word}</div></div>
      <div class="teach-tr">${meaning}</div>
      <div class="teach-syn">Synonym: ${word.synonym}</div>
      ${renderExample(word)}
      ${renderWordFamily(word)}
      <div class="teach-tip">${memTip(word.word,meaning,word.synonym)}</div>
    </div>
    <div class="nav-dots">${dots}</div>
    ${idx<words.length-1
      ?`<button class="btn-full" onclick="nextTeach()">Sonraki Kelime</button>`
      :`<button class="btn-full" onclick="doneTeach()">Tekrar Test Et</button>`}
    ${idx>0?`<button class="btn-full secondary" onclick="prevTeach()">Onceki</button>`:''}
  `;
}

function renderResult(app){
  app.innerHTML=`
    <div class="result-card">
      <div class="result-emoji">100%</div>
      <div class="result-title">Turu Tamamladin!</div>
      <div class="result-sub">Bu turdaki kelimeleri tamamladin.<br>Toplam ogrenilen: <strong>${S.learnedWords.length} kelime</strong></div>
      <div class="result-stats">
        <div class="stat-box g">
          <div class="stat-num">${S.learnedWords.length}</div>
          <div class="stat-label">Ogrenilen</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" style="color:var(--muted)">${S.allWords.length-S.learnedWords.length}</div>
          <div class="stat-label">Kalan</div>
        </div>
      </div>
      <button class="btn-full" onclick="startNewQuiz()">Yeni Tur Baslat</button>
    </div>
  `;
}

function renderLearned(app){
  const words=S.learnedWords;
  app.innerHTML=`
    <div class="list-header">
      <h2>Ogrendiklerim</h2>
      <span class="list-count">${words.length} kelime</span>
    </div>
    ${words.length===0?`
      <div class="empty-state">
        <div class="empty-icon">0</div>
        <p>Henuz kelime ogrenmedin.<br>Quiz'e giderek ogrenmeye basla!</p>
      </div>
    `:words.slice().reverse().map(w=>`
      <div class="list-item">
        <div>
          <div class="list-word">${w.word}</div>
          <div style="font-size:0.72rem;color:var(--muted);margin-top:2px">${w.synonym}</div>
        </div>
        <div class="list-tr">${trOf(w)}</div>
      </div>
    `).join('')}
    ${words.length>0?`<button class="btn-full secondary" style="margin-top:12px;color:var(--red)" onclick="clearLearned()">Listeyi Sifirla</button>`:''}
  `;
}

function clearLearned(){
  if(confirm('Listeyi sifirlamak istedigine emin misin?')){
    S.learnedWords=[]; S.usedWords=new Set(); save(); render();
  }
}

const PHRASE_FAMILIES = {

  'take responsibility':'responsible', 'make a decision':'decide',
  'reach an agreement':'agree', 'gain access':'access', 'pay attention':'attend',
  'maintain stability':'stable', 'build trust':'trust', 'face a challenge':'challenge',
  'have an impact':null
};
const PHRASE_FOCUS = {
  'take action':'action', 'reduce costs':'cost', 'raise awareness':'awareness',
  'take responsibility':'responsibility', 'make a decision':'decision',
  'reach an agreement':'agreement', 'gain access':'access', 'pay attention':'attention',
  'maintain stability':'stability', 'build trust':'trust', 'face a challenge':'challenge'
};
for(const [phrase,target] of Object.entries(PHRASE_FAMILIES)) {
  if(target===null) continue;
  const family=FAMILY_BY_WORD.get(target);
  if(!family) throw new Error('Eksik kelime ailesi: '+phrase+' → '+target);
  if(!family.some(form=>form.word.toLowerCase()===PHRASE_FOCUS[phrase])) {
    throw new Error('Geçersiz ifade vurgusu: '+phrase);
  }
}
function renderWordFamily(word) {
  const key=word.word.trim().toLowerCase();
  const isPhrase=Object.hasOwn(PHRASE_FAMILIES,key);
  const target=isPhrase?PHRASE_FAMILIES[key]:key;
  if(target===null) return '';
  const family=FAMILY_BY_WORD.get(target);
  if(!family) return '';
  const focus=isPhrase?PHRASE_FOCUS[key]:key;
  const typeNames={V:'Fiil',N:'İsim',Adj:'Sıfat',Adv:'Zarf'};
  return `<section class="word-family" aria-label="Kelime ailesi">
    <h3>Kelime ailesi</h3>

// Persistent practice history and calendar-day spaced repetition.
const REVIEW_DAYS = [1, 3, 7];
let practice = { version: 1, words: {}, days: {} };
S.mode = 'meaning';
S.session = 'new';
S.sessionCorrect = 0;
S.sessionAnswers = 0;

function dayKey(date = new Date()) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function addDays(key, days) {
  const [y,m,d] = key.split('-').map(Number);
  return dayKey(new Date(y,m-1,d+days,12));
}
function savePractice() {
  try { localStorage.setItem('kl_practice_v1',JSON.stringify(practice)); } catch(e) {}
}
function loadPractice() {
  try {
    const raw = JSON.parse(localStorage.getItem('kl_practice_v1') || 'null');
    if(raw && raw.version===1 && raw.words && raw.days) {
      const validIDs = new Set(S.allWords.map(w=>String(w.id)));
      for(const [id,r] of Object.entries(raw.words)) {
        if(validIDs.has(id) && r && Number.isInteger(r.stage) && r.stage>=0 && r.stage<=3 && /^\d{4}-\d{2}-\d{2}$/.test(r.due)) practice.words[id]=r;
      }
      for(const [key,r] of Object.entries(raw.days)) {
        if(/^\d{4}-\d{2}-\d{2}$/.test(key) && r && Number.isFinite(r.total) && Number.isFinite(r.correct) && r.total>=0 && r.correct>=0 && r.correct<=r.total) practice.days[key]=r;
      }
    }
  } catch(e) {}
  // Existing learned words are eligible for review tomorrow, without invented statistics.
  for(const w of S.learnedWords) {
    if(S.allWords.some(a=>a.id===w.id) && !practice.words[w.id]) practice.words[w.id]={stage:0,due:addDays(dayKey(),1),correct:0,wrong:0,last:null};
  }
  savePractice();
}
function dueWords() {
  const today=dayKey();
  return S.allWords.filter(w=>practice.words[w.id] && practice.words[w.id].due<=today)
    .sort((a,b)=>practice.words[a.id].due.localeCompare(practice.words[b.id].due));
}
function recordPractice(word, ok) {
  const today=dayKey();
  const r=practice.words[word.id] || {stage:0,correct:0,wrong:0,last:null,due:today};
  if(ok) {
    r.correct++;
    // Same-day corrective tests do not skip scheduled repetition intervals.
    if(r.last!==today) r.stage=Math.min(r.stage+1,3);
  } else {
    r.wrong++;
    r.stage=0;
  }
  r.last=today;
  r.due=addDays(today,REVIEW_DAYS[Math.max(0,r.stage-1)]);
  practice.words[word.id]=r;
  const day=practice.days[today] || {total:0,correct:0};
  day.total++;
  if(ok) day.correct++;
  practice.days[today]=day;
  S.sessionAnswers++;
  if(ok) S.sessionCorrect++;
  savePractice();
}

function clozeSentence(word) {
  const ex=EXAMPLES[word.word];
  if(!ex) return escapeHTML(word.word);
  const start=ex.en.toLowerCase().indexOf(word.word.toLowerCase());
  if(start<0) return escapeHTML(ex.en);
  return escapeHTML(ex.en.slice(0,start))+'<span class="cloze-gap" aria-label="Boşluk">_____</span>'+escapeHTML(ex.en.slice(start+word.word.length));
}

pick=function(i) {
  if(S.answered || !Number.isInteger(i) || i<0 || i>=S.choices.length) return;
  S.selected=i; S.answered=true;
  const word=S.quiz[S.idx], ok=i===S.correctPos;
  if(ok) {
    if(!S.learnedWords.some(w=>w.id===word.id)) S.learnedWords.push(word);
  } else {

function syncTabs() {

switchTab=function(t) {S.tab=t; syncTabs(); render();};
const originalRender=render;
render=function() {

const originalRenderQuiz=renderQuiz;
renderQuiz=function(app) {

    app.querySelectorAll('.choice-text').forEach((el,i)=>{el.textContent=S.choices[i].word;});

};
const originalRenderResult=renderResult;

function renderMistakes(app) {
  const words=S.allWords.filter(w=>(practice.words[w.id]?.wrong || 0)>0)
    .sort((a,b)=>practice.words[b.id].wrong-practice.words[a.id].wrong);

    ${words.map(w=>{const r=practice.words[w.id]; return `<details class="mistake-card"><summary><strong>${escapeHTML(w.word)}</strong><span>${r.wrong} yanlış · ${escapeHTML(trOf(w))}</span></summary><div class="mistake-body"><div class="teach-syn">Eş anlamlı: ${escapeHTML(w.synonym)}</div>${renderExample(w)}${renderWordFamily(w)}<p class="screen-note">Sonraki tekrar: ${dueLabel(r.due)}${r.due<=dayKey()?' · Zamanı geldi':''}</p></div></details>`;}).join('')}`;

function streakCount() {
  let key=dayKey(), count=0;
  if(!practice.days[key]?.total) key=addDays(key,-1);

for (const extra of CONNECTOR_EXTRA_QUESTIONS) {
  const connector = CONNECTORS.find(c => c.word === extra.word);
  connector.questions.push(...extra.questions);
}
const connectorClozeTotal = CONNECTORS.reduce((total, c) => total + c.questions.length, 0);

let connectorHistory={};
try {
  const saved=JSON.parse(localStorage.getItem('kl_connectors_v1')||'{}');
  for(const c of CONNECTORS) {
    const r=saved?.[c.id];
    if(r && typeof r==='object') connectorHistory[c.id]={
      unlocked:r.unlocked===true,
      wrong:Number.isInteger(r.wrong)&&r.wrong>=0?r.wrong:0,
      correct:Number.isInteger(r.correct)&&r.correct>=0?r.correct:0
    };
  }
} catch(e) {}
let connectorQuestions={};
const connectorItems=CONNECTORS.flatMap(c=>[
  {c,mode:'meaning',key:'meaning:'+c.word},
  ...c.questions.map(q=>({c,q,mode:'cloze',key:'cloze:'+c.word+':'+q.sentence}))
]);
try {
  const saved=JSON.parse(localStorage.getItem('kl_connector_questions_v1')||'{}');
  for(const item of connectorItems){
    const r=saved?.[item.key];
    if(r && typeof r==='object') connectorQuestions[item.key]={
      solved:r.solved===true,needsReview:r.needsReview===true,
      wrong:Number.isInteger(r.wrong)&&r.wrong>=0?r.wrong:0,
      correct:Number.isInteger(r.correct)&&r.correct>=0?r.correct:0
    };
  }
} catch(e) {}
let connectorSession=null,connectorView='practice',connectorSaveFailed=false;
function saveConnectors(){
  try {
    localStorage.setItem('kl_connectors_v1',JSON.stringify(connectorHistory));
    localStorage.setItem('kl_connector_questions_v1',JSON.stringify(connectorQuestions));
    connectorSaveFailed=false;
  }catch(e){connectorSaveFailed=true;}
}
function allConnectorMeaningsLearned(){
  return CONNECTORS.every(c=>connectorHistory[c.id]?.unlocked);
}
function connectorHome(view='practice'){
  connectorSession=null;connectorView=view;S.tab='connectors';syncTabs();render();
}
function startConnectors(mode,tier=0,review=false){
  if(mode==='cloze'&&!allConnectorMeaningsLearned())return;
  const questions=connectorItems.filter(item=>{
    if(item.mode!==mode || (tier && item.c.tier!==tier))return false;
    if(review)return mode==='meaning'?connectorHistory[item.c.id]?.unlocked:connectorQuestions[item.key]?.solved;
    return mode==='meaning'?!connectorHistory[item.c.id]?.unlocked:!connectorQuestions[item.key]?.solved;
  });
  beginConnectorSession(questions);
}
function startConnectorMistakes(){
  beginConnectorSession(connectorItems.filter(item=>connectorQuestions[item.key]?.needsReview &&
    (item.mode==='meaning'||allConnectorMeaningsLearned())));
}
function beginConnectorSession(questions){
  if(!questions.length)return;
  connectorSession={items:shuffle(questions),idx:0,score:0,answered:false,selected:null};
  prepareConnector();render();
}
function prepareConnector(){
  const s=connectorSession,item=s.items[s.idx];
  s.answered=false;s.selected=null;
  if(item.mode==='meaning'){
    s.options=connectorMeaningOptions(item.c);s.answer=item.c.meaning;
  }else{
    s.options=shuffle([item.q.answer,...item.q.others]);s.answer=item.q.answer;
  }
}
function answerConnector(i){
  const s=connectorSession;
  if(!s||s.answered||!Number.isInteger(i)||i<0||i>=s.options.length)return;
  const item=s.items[s.idx],ok=s.options[i]===s.answer;
  s.answered=true;s.selected=i;if(ok)s.score++;
  const r=connectorHistory[item.c.id]||(connectorHistory[item.c.id]={unlocked:false,wrong:0,correct:0});
  const p=connectorQuestions[item.key]||(connectorQuestions[item.key]={solved:false,needsReview:false,wrong:0,correct:0});
  if(ok){
    r.correct++;p.correct++;p.solved=true;p.needsReview=false;
    if(item.mode==='meaning')r.unlocked=true;
  }else{
    r.wrong++;p.wrong++;p.solved=false;p.needsReview=true;s.items.push(item);
  }
  saveConnectors();render();
}
function nextConnector(){
  const s=connectorSession;if(!s||!s.answered)return;
  s.idx++;if(s.idx<s.items.length)prepareConnector();render();
}
function connectorOverview(){
  const learned=CONNECTORS.filter(c=>connectorHistory[c.id]?.unlocked);
  const mistakes=connectorItems.filter(item=>connectorQuestions[item.key]?.wrong>0);
  const unresolved=mistakes.filter(item=>connectorQuestions[item.key]?.needsReview);
  const solved=connectorItems.filter(item=>item.mode==='cloze'&&connectorQuestions[item.key]?.solved).length;
  const ready=allConnectorMeaningsLearned();
  let html='<div class="teach-header"><h2>Edat, Cümle Zarfı & Bağlaç</h2><p>'+learned.length+' / '+CONNECTORS.length+' anlam öğrenildi · '+solved+' / '+connectorClozeTotal+' cümle tamamlandı</p></div>'+
    '<div class="tabs">'+[['practice','Çalış'],['learned','Öğrendiklerim ('+learned.length+')'],['mistakes','Yanlışlarım ('+unresolved.length+')']].map(([view,label])=>
      '<button class="tab '+(connectorView===view?'active':'')+'" onclick="connectorHome(\''+view+'\')">'+label+'</button>').join('')+'</div>'+
    (connectorSaveFailed?'<p class="screen-note" role="alert">İlerleme kaydedilemedi. Tarayıcı depolama ayarlarını kontrol et.</p>':'');
  if(connectorView==='learned'){
    html+='<p class="screen-note">Öğrendiğin anlamlar bu tarayıcıda kaydedilir. Yeni anlam testlerinde tekrar sorulmaz; istersen buradan tekrar çalışabilirsin.</p>'+
      (learned.length?'<button class="btn-full" onclick="startConnectors(\'meaning\',0,true)">Öğrendiklerimi Tekrarla</button>':'<p class="screen-note">Doğru bildiğin anlamlar burada görünecek.</p>')+
      learned.map(c=>'<div class="list-item"><span><span class="list-word">'+escapeHTML(c.word)+'</span><br><small>'+escapeHTML(c.group)+'</small></span><span class="list-tr">'+escapeHTML(c.meaning)+'</span></div>').join('');
  }else if(connectorView==='mistakes'){
    html+='<p class="screen-note">Yanlışların saklanır. Yeniden doğru cevapladığında “Düzeltildi” olarak işaretlenir.</p>'+
      (unresolved.length?'<button class="btn-full" onclick="startConnectorMistakes()">Yanlışlarımı Çalış</button>':'')+
      (mistakes.length?mistakes.map(({c,q,key,mode})=>'<details class="mistake-card"><summary>'+escapeHTML(c.word)+' · '+(mode==='meaning'?'Anlam':'Boşluk doldurma')+
        '<span>'+connectorQuestions[key].wrong+' yanlış · '+(connectorQuestions[key].needsReview?'Tekrar gerekiyor':'Düzeltildi')+'</span></summary><div class="mistake-body"><p class="teach-tr">'+escapeHTML(c.meaning)+'</p><p class="teach-tip">'+escapeHTML(c.tip)+'</p><p class="teach-example-en">'+escapeHTML((q||c.questions[0]).sentence.replace('_____', (q||c.questions[0]).answer))+'</p><p class="teach-example-tr">'+escapeHTML((q||c.questions[0]).translation)+'</p></div></details>').join(''):'<p class="screen-note">Henüz yanlış cevabın yok.</p>');
  }else{
    html+='<p class="screen-note">Önce 20 ifadenin tamamının anlamını öğren. Ardından '+connectorClozeTotal+' boşluk doldurma sorusu açılır. Her cevabın anında kaydedilir; kaldığın yerden devam edersin. Yanlışlar tur sonunda tekrar sorulur.</p>'+
      (!ready?'<button class="btn-full" onclick="startConnectors(\'meaning\')">Kalan Anlamları Çalış ('+(CONNECTORS.length-learned.length)+')</button>':'<p class="teach-tr">Tüm anlamları öğrendin. Boşluk doldurma açık!</p>')+
      [1,2,3].map(t=>{
        const pool=CONNECTORS.filter(c=>c.tier===t),remaining=pool.filter(c=>!connectorHistory[c.id]?.unlocked).length;
        const total=pool.reduce((sum,c)=>sum+c.questions.length,0);
        const left=connectorItems.filter(item=>item.mode==='cloze'&&item.c.tier===t&&!connectorQuestions[item.key]?.solved).length;
        return '<div class="teach-card"><h3>'+['','1 · Sık karşılaşılanlar','2 · Orta düzey','3 · İleri / daha az karşılaşılanlar'][t]+'</h3>'+
          '<p class="screen-note">'+(pool.length-remaining)+' / '+pool.length+' anlam öğrenildi · '+(total-left)+' / '+total+' cümle tamamlandı</p>'+
          '<button class="btn-full" '+(!remaining?'disabled':'')+' onclick="startConnectors(\'meaning\','+t+')">Kalan Anlamlar ('+remaining+')</button>'+
          '<button class="btn-full secondary" '+(!ready||!left?'disabled':'')+' onclick="startConnectors(\'cloze\','+t+')">Kalan Boşluk Soruları ('+left+')</button>'+
          (ready&&!left?'<button class="btn-full secondary" onclick="startConnectors(\'cloze\','+t+',true)">Tamamlanan Cümleleri Tekrarla</button>':'')+'</div>';
      }).join('');
  }
  return html;
}
function renderConnectors(app){
  const s=connectorSession;
  if(!s){app.innerHTML=connectorOverview();return;}
  if(s.idx>=s.items.length){
    app.innerHTML='<div class="result-card"><div class="result-title">Tur tamamlandı!</div><p class="screen-note">'+s.score+' / '+s.items.length+' doğru · Tekrar cevapları dahil.</p><button class="btn-full" onclick="connectorHome()">Bölümlere Dön</button></div>';return;
  }
  const {c,q,mode}=s.items[s.idx];
  app.innerHTML='<button class="btn-full secondary" onclick="connectorHome()">← Bölümlere Dön</button>'+
    '<p class="session-label">'+(s.idx+1)+' / '+s.items.length+' · '+(mode==='meaning'?'Anlam testi':'Boşluk doldurma')+'</p>'+
    '<div class="quiz-card"><span class="word-type-badge badge-Expr">'+escapeHTML(c.group)+'</span>'+
    (mode==='cloze'?'<span class="word-type-badge badge-Adv">'+q.level+'</span>':'')+
    '<div class="'+(mode==='meaning'?'quiz-word':'cloze-sentence')+'" lang="en">'+escapeHTML(mode==='meaning'?c.word:q.sentence)+'</div>'+
    '<p class="quiz-label">'+(mode==='meaning'?'Türkçe anlamını seç':'Boşluğa uygun ifadeyi seç')+'</p></div>'+
    '<div class="choices">'+s.options.map((o,i)=>{
      const cls=s.answered?(o===s.answer?' correct':i===s.selected?' wrong':' dimmed'):'';
      return '<button class="choice-btn'+cls+'" '+(s.answered?'disabled':'')+' onclick="answerConnector('+i+')"><span class="cletter">'+LETTERS[i]+'</span><span class="choice-text">'+escapeHTML(o)+'</span></button>';
    }).join('')+'</div>'+
    (s.answered?'<div class="teach-card"><div class="teach-tr">'+escapeHTML(c.word)+' — '+escapeHTML(c.meaning)+'</div>'+
      '<p class="teach-tip">'+escapeHTML(c.tip)+'</p><p class="teach-example-en" lang="en">'+escapeHTML((q||c.questions[0]).sentence.replace('_____', (q||c.questions[0]).answer))+'</p>'+
      (s.options[s.selected]!==s.answer?'<p class="teach-example-tr" lang="tr"><strong>Türkçe:</strong> '+escapeHTML((q||c.questions[0]).translation)+'</p>':'')+
      '<p class="screen-note">'+(s.options[s.selected]===s.answer?(mode==='meaning'?'Bu anlam Öğrendiklerim’e kaydedildi.':'Doğru kullanım!'):'Bu soru turun sonunda yeniden gelecek.')+'</p></div>'+
      '<button class="next-btn" onclick="nextConnector()">Devam Et →</button>':'');
}
const renderBeforeConnectors=render;
render=function(){
  if(S.tab==='connectors'){renderConnectors(document.getElementById('app'));return;}
  renderBeforeConnectors();
};

// ===== INIT =====
S.allWords=RAW.map((r,i)=>({id:i,word:r[0],synonym:r[1],tr:r[2],type:r[3]}));
load();
loadPractice();
startNewQuiz();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
